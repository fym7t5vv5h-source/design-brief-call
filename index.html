<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#15201a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Brief</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Закрыть">×</button>
      <img id="lightboxImage" alt="Референс" />
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>

    <div class="modal" id="exportModal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2>Экспорт брифа</h2>
          <button type="button" class="btn ghost" id="closeExport">Закрыть</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn primary" id="copyExport">Копировать</button>
          <button type="button" class="btn ghost" id="downloadExport">Скачать .md</button>
          <button type="button" class="btn ghost" id="printExport">Печать / PDF</button>
        </div>
        <pre id="exportPreview"></pre>
      </div>
    </div>

    <script type="module" src="js/app.js?v=20260811o"></script>
  </body>
</html>
